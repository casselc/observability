# The heavier suites, nightly and on demand (ci/README.md): the edges end to
# end through the consumer, the fault and soak runs, the model checks, and
# the tests that load libchdb.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: >-
          jobs to run: "all", or a comma list of build, conformance, close_e2e,
          query-integration, query-kms-emulator, hdxadapter-integration,
          lakeui-e2e, lakeui-mosaic-e2e, journeys, alerts-integration, faults-soak,
          rust-integration, dst, hegel, rust-mbt (or mbt_s3inline,
          mbt_s3inline_metrics, mbt_s3inline_consumer), model, kani, chdb,
          upstream-patches. A job that needs the build's binaries brings build.
        default: all
      soak_seconds:
        description: consumer soak duration (s)
        default: "300"

# The group includes the job selection: GitHub keeps only the newest *pending* run of a group, so with
# one group per ref a dispatch of one job set silently cancelled another's queued run (CAST 55).
concurrency:
  group: nightly-${{ github.ref }}-${{ inputs.jobs || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.27.x"
  QUINT_VERSION: "0.32.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Every tagged test appends a record here when it finishes (ci/README.md, "Traceability");
  # each job uploads the file as trace-<job>, and the traceability job joins them.
  OSCOPE_TRACE_OUT: ${{ github.workspace }}/_trace/records.jsonl
  # quint's node process holds every generated trace: 3.5-4.3 GB for the
  # 300-1000-trace mbt instances. Node's default heap limit on the 8 GB
  # runners is ~2 GB ("JavaScript heap out of memory", which quint-connect
  # reports only as "Quint returned non-zero code.").
  NODE_OPTIONS: --max-old-space-size=5120

jobs:
  # Which jobs this run runs (ci/README.md, "Running part of the nightly"):
  # every one on schedule; on workflow_dispatch those `inputs.jobs` names,
  # plus build when one of them needs its artifact. An unknown name fails
  # here, not silently as a run that tested nothing.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mbt: ${{ steps.plan.outputs.mbt }}
    steps:
      - id: plan
        env:
          JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs || 'all' }}
        run: |
          python3 - <<'EOF'
          import json, os
          jobs = ["build", "conformance", "close_e2e", "query-integration", "query-kms-emulator",
                  "hdxadapter-integration", "lakeui-e2e", "lakeui-mosaic-e2e", "journeys", "alerts-integration",
                  "faults-soak", "rust-integration", "dst", "hegel", "model", "kani", "chdb",
                  "upstream-patches"]
          mbt = ["mbt_s3inline", "mbt_s3inline_metrics", "mbt_s3inline_consumer"]
          # the jobs that download the build job's `bin` artifact
          uses_build = ["conformance", "close_e2e", "query-integration", "lakeui-e2e",
                        "lakeui-mosaic-e2e", "journeys", "alerts-integration", "faults-soak"]
          want = {w.strip() for w in os.environ["JOBS"].split(",") if w.strip()}
          if not want or "all" in want:
              want = set(jobs) | set(mbt)
          if "rust-mbt" in want or "mbt" in want:
              want |= set(mbt)
              want -= {"rust-mbt", "mbt"}
          unknown = sorted(want - set(jobs) - set(mbt))
          if unknown:
              raise SystemExit(f"::error::unknown nightly job(s) {unknown}; known: all, {', '.join(jobs + ['rust-mbt'] + mbt)}")
          if want & set(uses_build):
              want.add("build")
          run = {j: j in want for j in jobs}
          sel = [m for m in mbt if m in want]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={json.dumps(run)}\n")
              f.write(f"mbt={json.dumps(sel)}\n")
          print("running:", ", ".join(sorted(want)))
          EOF

  # Release binaries (otap-s3pq, consume), the Go tools and the Go edge
  # (otelcol-s3pq), shared with the end-to-end jobs as one artifact; plus the
  # otelcol-chdb distribution as a build check.
  build:
    needs: plan
    if: fromJSON(needs.plan.outputs.run).build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.ci/otel-arrow
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        working-directory: otel-chdb/otap-rs
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        id: upstream
        with:
          path: .ci/otel-arrow
          key: otel-arrow-${{ hashFiles('otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
      - name: Upstream otel-arrow (pinned + patches)
        working-directory: otel-chdb/otap-rs
        run: |
          if [ "${{ steps.upstream.outputs.cache-hit }}" = true ]; then ln -sfn "$UPSTREAM_DIR" .upstream
          else scripts/fetch-upstream.sh "$UPSTREAM_DIR"; fi
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            otel-chdb/otap-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('otel-chdb/otap-rs/rust-toolchain.toml', 'otel-chdb/otap-rs/Cargo.lock', 'otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - name: cargo build --release
        working-directory: otel-chdb/otap-rs
        run: cargo build --release --locked --bins
      - name: Go tools and datasets' generators
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cp -f otel-chdb/otap-rs/target/release/{otap-s3pq,consume} "$RUNNER_TEMP/bin/"
          (cd otel-chdb/otap-rs/tools && go build -o "$RUNNER_TEMP/bin/" ./cmd/...)
          (cd otel-chdb/parquetgo/compare && go build -o "$RUNNER_TEMP/bin/" ./cmd/credstubs)
      - name: Collectors (ocb)
        run: ci/build-collectors.sh "$RUNNER_TEMP/bin" all
      - name: Pack
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/bin.tgz" bin && ls -la "$RUNNER_TEMP/bin"
      - uses: actions/upload-artifact@v7
        with:
          name: bin
          path: ${{ runner.temp }}/bin.tgz
          retention-days: 3

  # Cross-edge conformance (both layouts) and the Go edge under faults.
  conformance:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.run).conformance || fromJSON(needs.plan.outputs.run).close_e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyarrow requests
      - name: compare.py unit tests (its queries against the consumer's DDL)
        if: fromJSON(needs.plan.outputs.run).conformance
        working-directory: otel-chdb/conformance
        run: python3 -m unittest -v compare_test
      - name: Traceability record (compare_test.py is CAST row 45's regression check)
        if: fromJSON(needs.plan.outputs.run).conformance
        run: python3 ci/trace/trace.py record --test conformance/compare_test.py --technique D --ids CAST-45,H-2
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/bin.tgz"
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: Datasets
        env:
          VARIANTS: "12"
          CONFORMANCE: "1"
        run: ci/gen-data.sh "$RUNNER_TEMP/data" "$RUNNER_TEMP/genbin"
      - name: conformance/run.sh (layout B, series_table)
        if: fromJSON(needs.plan.outputs.run).conformance
        env:
          B: ${{ runner.temp }}/bin
          D: ${{ runner.temp }}/data
          W: ${{ runner.temp }}/out/conformance
          RUN: ci${{ github.run_id }}b
        run: otel-chdb/conformance/run.sh
      - name: conformance/run.sh (ClickStack metrics tables)
        if: fromJSON(needs.plan.outputs.run).conformance
        env:
          B: ${{ runner.temp }}/bin
          D: ${{ runner.temp }}/data
          W: ${{ runner.temp }}/out/conformance
          RUN: ci${{ github.run_id }}c
          LAYOUT: clickstack_tables
          DATASETS: metrics-testgen-3000 metrics-nasty-700 metrics-extra metrics-hostile metrics-mixed-10000
        run: otel-chdb/conformance/run.sh
      - name: conformance/go_faults.sh
        if: fromJSON(needs.plan.outputs.run).conformance
        env:
          B: ${{ runner.temp }}/bin
          D: ${{ runner.temp }}/data
          OUT: ${{ runner.temp }}/out/go-faults
          RUN: ci${{ github.run_id }}
        run: |
          otel-chdb/conformance/go_faults.sh
          ci/verdict.sh "$OUT/summary.txt" 6
      # The orderly close (FORMAT.md §3.1, D35): each edge stopped in order
      # leaves a close as the last slot of every lane; the consumer retires
      # them and the cluster's complete_through passes; a restart on the same
      # Quiver buffer is reborn and nothing is quarantined.
      - name: otap-rs/scripts/close_e2e.sh (rust, rust-durable with a restart, go)
        if: fromJSON(needs.plan.outputs.run).close_e2e
        env:
          B: ${{ runner.temp }}/bin
          D: ${{ runner.temp }}/data
          W: ${{ runner.temp }}/out/close
        run: |
          EDGE=rust RUN=ci${{ github.run_id }}cr otel-chdb/otap-rs/scripts/close_e2e.sh
          EDGE=rust-durable RESTART=1 RUN=ci${{ github.run_id }}cd otel-chdb/otap-rs/scripts/close_e2e.sh
          EDGE=go RUN=ci${{ github.run_id }}cg otel-chdb/otap-rs/scripts/close_e2e.sh
      - name: Service logs
        if: failure()
        run: mkdir -p "$RUNNER_TEMP/out" && ci/services.sh logs > "$RUNNER_TEMP/out/services.log" 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-conformance
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The query service against the real pipeline: the Go edge publishes two
  # clusters, the Rust consumer ingests them and publishes complete_through,
  # and the service answers scoped queries and plans (otel-chdb/query).
  query-integration:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.run)['query-integration']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/bin.tgz"
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: go test ./integration (otel-chdb/query)
        working-directory: otel-chdb/query
        env:
          QS_IT_BIN: ${{ runner.temp }}/bin
        run: go test -count=1 -timeout 10m -v ./integration
      - name: Service logs
        if: failure()
        run: ci/services.sh logs || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-query-integration
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The query service's KMS basis signer against moto server's KMS
  # (DECISIONS D30 amendment 2026-09-28): startup check, two replicas,
  # tampering, latency.
  query-kms-emulator:
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['query-kms-emulator']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - name: moto server
        run: pipx install 'moto[server]==5.2.3'
      - name: ci/kms-emulator.sh
        run: ci/kms-emulator.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-query-kms-emulator
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The HyperDX adapter (otel-chdb/query/integration/hdxadapter): HyperDX
  # 2.39.1's 799 captured statements through the adapter and the query service
  # onto ClickHouse, each answer compared with ClickHouse's own; the same for
  # a one-cluster token against the scope filter; labels; and
  # @clickhouse/client (HyperDX's pin) driving the adapter. Since D33 also the
  # entity rewrite proxy's statements through adapter and service (a
  # two-cluster catalog, the dictionary leak probe), labelled samples, and the
  # key/value rollup migration.
  hdxadapter-integration:
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['hdxadapter-integration']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "@clickhouse/client, HyperDX's pin"
        run: npm install --prefix "$RUNNER_TEMP/hdxnode" --no-audit --no-fund @clickhouse/client@1.23.0-head.fae5998.1
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: go test ./integration/hdxadapter (otel-chdb/query)
        working-directory: otel-chdb/query
        env:
          HDXA_IT: "1"
          HDXA_IT_NODE_MODULES: ${{ runner.temp }}/hdxnode/node_modules
        run: go test -count=1 -timeout 15m -v ./integration/hdxadapter
      - name: Service logs
        if: failure()
        run: ci/services.sh logs || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-hdxadapter-integration
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The lake UI in Chromium (otel-chdb/lakeui/e2e): the Go edge (two
  # clusters) -> SeaweedFS -> the Rust consumer -> ClickHouse, the query
  # service's /v1/plan (query/integration/lakeuirig), sign-in by code + PKCE on
  # the test issuer; results against ClickHouse counts, refusals, a real
  # expired-URL 403 and re-plan, bytes fetched per object.
  lakeui-e2e:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.run)['lakeui-e2e']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: otel-chdb/lakeui/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/bin.tgz"
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: npm ci, Chromium
        working-directory: otel-chdb/lakeui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the rig
        working-directory: otel-chdb/query
        run: go build -o "$RUNNER_TEMP/lakeuirig" ./integration/lakeuirig
      - name: playwright test (otel-chdb/lakeui)
        working-directory: otel-chdb/lakeui
        env:
          QS_IT_BIN: ${{ runner.temp }}/bin
          LAKEUI_RIG_BIN: ${{ runner.temp }}/lakeuirig
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lakeui-e2e
          path: otel-chdb/lakeui/test-results
          if-no-files-found: ignore
      - name: Service logs
        if: failure()
        run: ci/services.sh logs || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-lakeui-e2e
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The Mosaic spike (otel-chdb/lakeui/mosaic, research/mosaic.md) on the
  # same rig with LUI_RICH_SPANS: range reads vs DuckDB reading the URLs,
  # cross-filter exactness, brush latency with and without pre-aggregation,
  # stale cubes, an unknown watermark; numbers as the artifact.
  lakeui-mosaic-e2e:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.run)['lakeui-mosaic-e2e']
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            otel-chdb/lakeui/package-lock.json
            otel-chdb/lakeui/mosaic/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/bin.tgz"
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: npm ci (lakeui and the spike), vendor (pinned; the parquet extension by SHA-256), Chromium
        run: |
          (cd otel-chdb/lakeui && npm ci --ignore-scripts --no-audit --no-fund)
          cd otel-chdb/lakeui/mosaic
          npm ci --ignore-scripts --no-audit --no-fund
          npm run vendor
          npx playwright install --with-deps chromium
      - name: Build the rig
        working-directory: otel-chdb/query
        run: go build -o "$RUNNER_TEMP/lakeuirig" ./integration/lakeuirig
      - name: playwright test (otel-chdb/lakeui/mosaic)
        working-directory: otel-chdb/lakeui/mosaic
        env:
          QS_IT_BIN: ${{ runner.temp }}/bin
          LAKEUI_RIG_BIN: ${{ runner.temp }}/lakeuirig
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lakeui-mosaic-e2e
          path: otel-chdb/lakeui/mosaic/test-results
          if-no-files-found: ignore
      - name: Service logs
        if: failure()
        run: ci/services.sh logs || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-lakeui-mosaic-e2e
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The user journeys (otel-chdb/docs/journeys): five stories through the
  # lake UI and one through the Mosaic spike, on one rig, asserted at every step, a picture per step and
  # a GIF per journey (e2e/journeys/render.sh). Fails when an assertion
  # does; the pictures are the artifact (the committed ones are refreshed
  # by running render.sh, never by hand).
  journeys:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.run).journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            otel-chdb/lakeui/package-lock.json
            otel-chdb/lakeui/mosaic/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/bin.tgz"
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: npm ci (lakeui; the Mosaic spike and its vendor/ for journey 6), Chromium, ffmpeg (the GIFs), DejaVu fonts
        run: |
          (cd otel-chdb/lakeui/mosaic && npm ci --ignore-scripts --no-audit --no-fund && npm run vendor)
          cd otel-chdb/lakeui
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Build the rig
        working-directory: otel-chdb/query
        run: go build -o "$RUNNER_TEMP/lakeuirig" ./integration/lakeuirig
      - name: journeys (render.sh)
        working-directory: otel-chdb/lakeui
        env:
          QS_IT_BIN: ${{ runner.temp }}/bin
          LAKEUI_RIG_BIN: ${{ runner.temp }}/lakeuirig
        run: e2e/journeys/render.sh "$RUNNER_TEMP/journeys-img"
      # render.sh fails unless every journey's every step passed, so each
      # record below stands for a whole journey (ci/README.md, "Traceability")
      - name: Traceability records (one per journey)
        run: |
          python3 ci/trace/trace.py record --test otel-chdb/lakeui/e2e/journeys/01-complete.spec.mjs --technique IT --ids R-S1,R-S2,H-2,H-5
          python3 ci/trace/trace.py record --test otel-chdb/lakeui/e2e/journeys/02-trace.spec.mjs --technique IT --ids H-2,R-S1
          python3 ci/trace/trace.py record --test otel-chdb/lakeui/e2e/journeys/03-scope.spec.mjs --technique IT --ids R-S8,H-6,H-2
          python3 ci/trace/trace.py record --test otel-chdb/lakeui/e2e/journeys/04-expiry.spec.mjs --technique IT --ids H-2,R-S2
          python3 ci/trace/trace.py record --test otel-chdb/lakeui/e2e/journeys/05-late.spec.mjs --technique IT --ids R-S1,R-S2,H-5,CAST-26
          python3 ci/trace/trace.py record --test otel-chdb/lakeui/e2e/journeys/06-mosaic.spec.mjs --technique IT --ids R-S1,R-S2,H-2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journeys
          path: |
            ${{ runner.temp }}/journeys-img
            otel-chdb/lakeui/test-results
          if-no-files-found: ignore
      - name: Service logs
        if: failure()
        run: ci/services.sh logs || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-journeys
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The alert evaluator against the real pipeline and the query service
  # (built from otel-chdb/query): rules fire and resolve, a stalled lane
  # pages "cannot evaluate", the missed windows are evaluated once the
  # watermark advances; two replicas share their state on S3 (otel-chdb/alerts).
  alerts-integration:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.run)['alerts-integration']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/bin.tgz"
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: go test ./integration (otel-chdb/alerts)
        working-directory: otel-chdb/alerts
        env:
          ALR_IT_BIN: ${{ runner.temp }}/bin
        run: go test -count=1 -timeout 15m -v ./integration
      - name: Service logs
        if: failure()
        run: ci/services.sh logs || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-alerts-integration
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The Rust edge under faults, then the consumer fleet under chaos (short).
  faults-soak:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.run)['faults-soak']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/bin.tgz"
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: Datasets
        env:
          VARIANTS: "12"
        run: ci/gen-data.sh "$RUNNER_TEMP/data" "$RUNNER_TEMP/genbin"
      - name: otap-rs/scripts/faults.sh
        working-directory: otel-chdb/otap-rs
        env:
          B: ${{ runner.temp }}/bin
          T: ${{ runner.temp }}/bin
          D: ${{ runner.temp }}/data
          OUT: ${{ runner.temp }}/out/faults
          RUN: ci${{ github.run_id }}
        run: |
          bash scripts/faults.sh   # the file is not executable in git
          ../../ci/verdict.sh "$OUT/summary.txt" 5
      - name: otap-rs/scripts/consumer_soak.sh (short)
        working-directory: otel-chdb/otap-rs
        env:
          B: ${{ runner.temp }}/bin
          OUT: ${{ runner.temp }}/out/soak
          DURATION: ${{ inputs.soak_seconds || '300' }}
          RUN: soakci${{ github.run_id }}
        run: |
          scripts/consumer_soak.sh
          ../../ci/verdict.sh "$OUT/summary.txt" 6
      - name: Service logs
        if: failure()
        run: mkdir -p "$RUNNER_TEMP/out" && ci/services.sh logs > "$RUNNER_TEMP/out/services.log" 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: faults-soak
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-faults-soak
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The credential modes against local stand-ins, and layout B against the Go
  # prototype on the fleet batches: the otap-rs integration tests the fast
  # workflow leaves out.
  rust-integration:
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['rust-integration']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.ci/otel-arrow
      OTAPRS_DATA: ${{ github.workspace }}/.ci/data
      OTAPRS_SERIES_GO: ${{ github.workspace }}/.ci/data/series/go
      OTAPRS_SERIES_FLEET: ${{ github.workspace }}/.ci/data/series/fleet
      OTAPRS_CREDSTUBS: ${{ github.workspace }}/.ci/creds
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        working-directory: otel-chdb/otap-rs
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        id: upstream
        with:
          path: .ci/otel-arrow
          key: otel-arrow-${{ hashFiles('otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
      - name: Upstream otel-arrow (pinned + patches)
        working-directory: otel-chdb/otap-rs
        run: |
          if [ "${{ steps.upstream.outputs.cache-hit }}" = true ]; then ln -sfn "$UPSTREAM_DIR" .upstream
          else scripts/fetch-upstream.sh "$UPSTREAM_DIR"; fi
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            otel-chdb/otap-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('otel-chdb/otap-rs/rust-toolchain.toml', 'otel-chdb/otap-rs/Cargo.lock', 'otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: Datasets (with the Go prototype's fleet objects)
        env:
          SERIES: "1"
          FLEET: "1"
        run: ci/gen-data.sh "$OTAPRS_DATA"
      - name: tests/series.rs (corr and fleet)
        working-directory: otel-chdb/otap-rs
        run: cargo test --release --locked --test series -- --nocapture
      - name: tests/creds.rs (credstubs on :18901-18904)
        working-directory: otel-chdb/otap-rs
        run: |
          mkdir -p "$OTAPRS_CREDSTUBS"
          (cd "$OTAPRS_CREDSTUBS" && exec "$OTAPRS_DATA/bin/credstubs" > credstubs.log 2>&1) &
          for _ in $(seq 50); do [ -s "$OTAPRS_CREDSTUBS/ca.pem" ] && break; sleep 0.2; done
          # credstubs is up: its gate fails rather than skips (testgate, CAST row 43)
          OSCOPE_REQUIRE_SERVICES="$OSCOPE_REQUIRE_SERVICES,credstubs" \
            cargo test --release --locked --test creds -- --nocapture --test-threads 1
      - name: Logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/out"; cp -r "$OTAPRS_CREDSTUBS" "$RUNNER_TEMP/out/" || true
          ci/services.sh logs > "$RUNNER_TEMP/out/services.log" 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rust-integration
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-rust-integration
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # Deterministic simulation of the consumer fleet (otap-rs/DST.md): new
  # seeds every night (the base follows the run number), 10,000 at level 1
  # and 200 over the simulated network, plus the emulators against the
  # services. A failing seed's trace is uploaded; the log has its repro line.
  dst:
    needs: plan
    if: fromJSON(needs.plan.outputs.run).dst
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: otel-chdb/otap-rs
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.ci/otel-arrow
      DST_TRACE_DIR: ${{ github.workspace }}/.ci/dst
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        id: upstream
        with:
          path: .ci/otel-arrow
          key: otel-arrow-${{ hashFiles('otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
      - name: Upstream otel-arrow (pinned + patches)
        run: |
          if [ "${{ steps.upstream.outputs.cache-hit }}" = true ]; then ln -sfn "$UPSTREAM_DIR" .upstream
          else scripts/fetch-upstream.sh "$UPSTREAM_DIR"; fi
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            otel-chdb/otap-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('otel-chdb/otap-rs/rust-toolchain.toml', 'otel-chdb/otap-rs/Cargo.lock', 'otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Start SeaweedFS and ClickHouse
        run: ../../ci/services.sh start
      - name: Build the simulation tests
        run: cargo test --release --locked --test dst_consumer --test dst_net --no-run
      - name: Level 1, 10,000 new seeds
        run: |
          mkdir -p "$DST_TRACE_DIR"
          DST_SEEDS=10000 DST_SEED_BASE=$(( GITHUB_RUN_NUMBER * 100000 )) \
            cargo test --release --locked --test dst_consumer -- fleet_seeds --nocapture
      - name: Level 2 (turmoil), 200 new seeds
        run: |
          DST_SEEDS=200 DST_SEED_BASE=$(( GITHUB_RUN_NUMBER * 100000 )) \
            cargo test --release --locked --test dst_net -- net_seeds --nocapture
      - name: Determinism, mutants, regressions, the emulators against the services
        run: DST_META_SEEDS=20 cargo test --release --locked --test dst_consumer --test dst_net
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dst-traces
          path: ${{ github.workspace }}/.ci/dst
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-dst
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # Property, stateful and concurrent tests with Hegel (otap-rs/HEGEL.md),
  # under hegel.toml's nightly profile: 3,000 cases per test from a fresh
  # seed, and a database of failing examples that the next night replays
  # first (the Actions cache; also uploaded as `hegel-db`). Then the planted
  # bugs the stateful machine must find (up to 20,000 cases each), and the
  # concurrent machine: real thread races on conditional writes against the
  # S3 emulator and SeaweedFS, plus its racy-store mutant.
  hegel:
    needs: plan
    if: fromJSON(needs.plan.outputs.run).hegel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: otel-chdb/otap-rs
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.ci/otel-arrow
      HEGEL_DEFAULT_PROFILE: nightly
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        id: upstream
        with:
          path: .ci/otel-arrow
          key: otel-arrow-${{ hashFiles('otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
      - name: Upstream otel-arrow (pinned + patches)
        run: |
          if [ "${{ steps.upstream.outputs.cache-hit }}" = true ]; then ln -sfn "$UPSTREAM_DIR" .upstream
          else scripts/fetch-upstream.sh "$UPSTREAM_DIR"; fi
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            otel-chdb/otap-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('otel-chdb/otap-rs/rust-toolchain.toml', 'otel-chdb/otap-rs/Cargo.lock', 'otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-
      # The failing examples found so far: a new entry every night (the key
      # holds the run id), restored from the newest one.
      - uses: actions/cache@v6
        with:
          path: otel-chdb/otap-rs/.hegel
          key: hegel-db-${{ github.run_id }}
          restore-keys: hegel-db-
      - name: Start SeaweedFS and ClickHouse
        run: ../../ci/services.sh start
      - name: Build the Hegel tests
        run: cargo test --release --locked --test hegel_props --test hegel_dst --test hegel_race --no-run
      - name: Properties (3,000 cases each, SQL against ClickHouse)
        env:
          HEGEL_CH: "1"
        run: cargo test --release --locked --test hegel_props
      - name: Stateful and swarm testing of the consumer fleet (3,000 cases)
        run: cargo test --release --locked --test hegel_dst -- hegel_dst_fleet --nocapture
      - name: The planted bugs, each found and shrunk (coord::Mutation)
        env:
          HEGEL_DST_MUTANTS: "1"
          HEGEL_DST_MUTANT_CASES: "20000"
        run: cargo test --release --locked --test hegel_dst -- hegel_dst_finds_mutants --nocapture
      - name: Concurrent races on conditional writes (emulator, then SeaweedFS; the racy-store mutant)
        env:
          HEGEL_RACE_MUTANTS: "1"
        run: |
          cargo test --release --locked --test hegel_race -- --nocapture
          HEGEL_TEST_CASES=300 HEGEL_RACE_S3=http://127.0.0.1:18333/otel HEGEL_RACE_RUN="ci-$GITHUB_RUN_ID" \
            cargo test --release --locked --test hegel_race -- race_conditional_writes --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hegel-db
          path: otel-chdb/otap-rs/.hegel
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-hegel
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The quint-connect model-based tests: quint drives the protocol and the
  # consumer through traces of ../model/*.qnt (the Rust evaluator). One test
  # binary per runner, one test at a time: each quint run takes 2.5-4 GB
  # (node plus the evaluator), and all three binaries' tests at once peaked
  # near 10 GB locally. No services: the consumer's own ClickHouse / S3
  # tests, which mbt_s3inline_consumer also includes, skip without them and
  # run in ci.yml's rust job.
  rust-mbt:
    name: otap-rs mbt (${{ matrix.test }})
    needs: plan
    if: needs.plan.outputs.mbt != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.plan.outputs.mbt) }}
    defaults:
      run:
        working-directory: otel-chdb/otap-rs
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.ci/otel-arrow
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        id: upstream
        with:
          path: .ci/otel-arrow
          key: otel-arrow-${{ hashFiles('otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
      - name: Upstream otel-arrow (pinned + patches)
        run: |
          if [ "${{ steps.upstream.outputs.cache-hit }}" = true ]; then
            ln -sfn "$UPSTREAM_DIR" .upstream
          else
            scripts/fetch-upstream.sh "$UPSTREAM_DIR"
          fi
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            otel-chdb/otap-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('otel-chdb/otap-rs/rust-toolchain.toml', 'otel-chdb/otap-rs/Cargo.lock', 'otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ env.QUINT_VERSION }}
      - name: Install quint and its Rust evaluator
        run: ../../ci/install-quint.sh
      - name: cargo test --test ${{ matrix.test }}
        env:
          QUINT_SEED: "0x5eed"
        run: cargo test --release --locked --test "${{ matrix.test }}" -- --test-threads=1 --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-rust-mbt-${{ matrix.test }}
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The consumer models (quint, Rust evaluator) and parquetgo's model check.
  model:
    needs: plan
    if: fromJSON(needs.plan.outputs.run).model
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ env.QUINT_VERSION }}
      - name: Install quint and its Rust evaluator (and bc for the report's timings)
        run: |
          ci/install-quint.sh
          command -v bc || { sudo apt-get update -q && sudo apt-get install -y -q bc; }
      - name: otap-rs/scripts/consumer_model.sh
        env:
          OUT: ${{ runner.temp }}/out/consumer-model.txt
        run: mkdir -p "$RUNNER_TEMP/out" && ci/model-check.sh
      - name: Traceability records (consumer model, ci/trace/models.txt)
        if: always()
        run: python3 ci/trace/trace.py model --script consumer_model --report "$RUNNER_TEMP/out/consumer-model.txt"
      - name: model/alertEvaluator.qnt (the alert evaluator, otel-chdb/alerts)
        run: mkdir -p "$RUNNER_TEMP/out" && otel-chdb/model/alert_model.sh | tee "$RUNNER_TEMP/out/alert-model.txt"
      - name: model/retirement.qnt (dead-lane retirement, FORMAT.md §3.1)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          SEED=$(printf '0x%x' $((RANDOM * 32768 + RANDOM))) otel-chdb/model/retirement_model.sh | tee "$RUNNER_TEMP/out/retirement-model.txt"
      - name: Traceability records (retirement model, ci/trace/models.txt)
        if: always()
        run: python3 ci/trace/trace.py model --script retirement_model --report "$RUNNER_TEMP/out/retirement-model.txt"
      - name: model/bitemporalCatalog.qnt (the catalog as bitemporal events, D32) and entities/bitemp against its traces
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          SEED=$(printf '0x%x' $((RANDOM * 32768 + RANDOM))) TRACES="$RUNNER_TEMP/bitemp-traces" otel-chdb/model/bitemp_model.sh | tee "$RUNNER_TEMP/out/bitemp-model.txt"
          cd otel-chdb/entities/bitemp && BITEMP_TRACES="$RUNNER_TEMP/bitemp-traces" go test -count=1 -run Model -v ./... | tail -3
      - name: parquetgo/modelcheck
        run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV" && set -a && . ci/test.env && set +a && LOG_DIR="$RUNNER_TEMP/out" ci/go-modules.sh test slow
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: model
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-model
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # Kani proofs of the consumer's lease window and check range
  # (otap-rs/VERIFY.md): every harness in otap-rs/verify, one at a time,
  # ~20 min; the largest peaks near 6 GB. The mutant harnesses
  # (expected to fail) are behind a feature and do not run here.
  kani:
    needs: plan
    if: fromJSON(needs.plan.outputs.run).kani
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KANI_VERSION: "0.68.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
          key: kani-${{ runner.os }}-${{ env.KANI_VERSION }}
      - name: Install Kani
        run: |
          command -v cargo-kani || cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - name: cargo kani (otap-rs/verify)
        working-directory: otel-chdb/otap-rs/verify
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cargo kani --output-format terse 2>&1 | tee "$RUNNER_TEMP/out/kani.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kani
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-kani
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The Go tests that load libchdb (the chdb-go fork, the chdb exporter with
  # its quint-driven property tests, parquetgo/compare's correctness run).
  chdb:
    needs: plan
    if: fromJSON(needs.plan.outputs.run).chdb
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBCHDB_DIR: ${{ github.workspace }}/.ci/libchdb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-nightly-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-nightly-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install quint
        run: ci/install-quint.sh
      - uses: actions/cache@v6
        id: libchdb
        with:
          path: .ci/libchdb
          key: libchdb-${{ runner.os }}-${{ hashFiles('otel-chdb/chdb-go/update_libchdb.sh') }}
      - name: libchdb (the release chdb-go/update_libchdb.sh pins)
        if: steps.libchdb.outputs.cache-hit != 'true'
        run: mkdir -p "$LIBCHDB_DIR" && cd "$LIBCHDB_DIR" && bash "$GITHUB_WORKSPACE/otel-chdb/chdb-go/update_libchdb.sh"
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: go test (chdb modules)
        env:
          CHDB_LIB_PATH: ${{ github.workspace }}/.ci/libchdb/libchdb.so
          PBT_QUINT: "1"
          LOG_DIR: ${{ runner.temp }}/out
        run: ci/go-modules.sh test chdb
      - name: Service logs
        if: failure()
        run: ci/services.sh logs > "$RUNNER_TEMP/out/services.log" 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: chdb
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-chdb
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # Our otel-arrow patches' own upstream unit tests, in the upstream
  # workspace at the pinned commit (patches/0006: Quiver's custody floor and
  # the durable buffer that publishes it). Too big for a local disk; the
  # otap-rs jobs only build these crates, they don't run their tests.
  upstream-patches:
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['upstream-patches']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.ci/otel-arrow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: upstream
        with:
          path: .ci/otel-arrow
          key: otel-arrow-${{ hashFiles('otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
      - name: Upstream otel-arrow (pinned + patches)
        working-directory: otel-chdb/otap-rs
        run: |
          if [ "${{ steps.upstream.outputs.cache-hit }}" = true ]; then ln -sfn "$UPSTREAM_DIR" .upstream
          else scripts/fetch-upstream.sh "$UPSTREAM_DIR"; fi
      - name: Toolchain (upstream's rust-toolchain.toml)
        working-directory: .ci/otel-arrow/rust/otap-dataflow
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .ci/otel-arrow/rust/otap-dataflow/target
          key: upstream-cargo-${{ runner.os }}-${{ hashFiles('otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
          restore-keys: upstream-cargo-${{ runner.os }}-
      - name: otel-arrow-dfe-otap custody tests (patch 0006)
        working-directory: .ci/otel-arrow/rust/otap-dataflow
        run: cargo test --release -p otel-arrow-dfe-otap --lib custody
      - name: otel-arrow-dfe-otap OTLP/HTTP paths, Langfuse's alias included (patch 0007)
        working-directory: .ci/otel-arrow/rust/otap-dataflow
        run: cargo test --release -p otel-arrow-dfe-otap --lib otlp_http::tests::maps_paths
      - name: otel-arrow-dfe-core-nodes durable_buffer tests (patch 0006)
        working-directory: .ci/otel-arrow/rust/otap-dataflow
        run: cargo test --release -p otel-arrow-dfe-core-nodes --features durable-buffer durable_buffer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-upstream-patches
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # Requirements-to-test traceability for this run's selected jobs (ci/README.md,
  # "Traceability"): as ci.yml's job, over the nightly's records. Tags whose jobs were not
  # selected, and rows only they claim, are reported as deferred, not judged.
  traceability:
    name: traceability (tagged tests ran and passed at this commit)
    needs: [plan, build, conformance, query-integration, query-kms-emulator, hdxadapter-integration, lakeui-e2e,
            lakeui-mosaic-e2e, journeys, alerts-integration, faults-soak, rust-integration, dst, hegel, rust-mbt, model, kani,
            chdb, upstream-patches]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: trace-*
          path: ${{ runner.temp }}/trace
      - name: trace.py check (the jobs the plan selected)
        env:
          RUN: ${{ needs.plan.outputs.run }}
          MBT: ${{ needs.plan.outputs.mbt }}
        run: |
          jobs=$(python3 -c 'import json, os; r = json.loads(os.environ["RUN"]); m = json.loads(os.environ["MBT"]); print(",".join([k for k, v in r.items() if v and k != "build"] + (["rust-mbt"] if m else [])))')
          echo "judging: $jobs"
          python3 ci/trace/trace.py check --workflow nightly --jobs "$jobs" \
            --records "$RUNNER_TEMP/trace" --report "$RUNNER_TEMP/TRACEABILITY.md" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traceability-report
          path: ${{ runner.temp }}/TRACEABILITY.md
          if-no-files-found: warn

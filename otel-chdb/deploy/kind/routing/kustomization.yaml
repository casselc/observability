# kind + service-affine routing (components/routing): the gateway tier and 8
# publishers (scaled to 4 here: one 4-CPU node).
#   kustomize build --load-restrictor LoadRestrictionsNone deploy/kind/routing
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-edge
resources:
  - ../edge
components:
  - ../../components/routing
images:
  - name: otelcol-deploy-lbpatched
    newName: localhost/otelcol-deploy-lbpatched
    newTag: v0.161.0
patches:
  - target:
      kind: StatefulSet
      name: otap-publisher
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  # the gateways' 500m requests left no room on one 4-CPU node for the
  # rolling update's surge pod (FailedScheduling: Insufficient cpu)
  - target:
      kind: Deployment
      name: otel-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: {cpu: 100m, memory: 256Mi}

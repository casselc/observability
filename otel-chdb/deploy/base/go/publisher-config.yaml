# The Go publisher: OTLP in -> memory_limiter -> s3pq (../../../parquetgo/
# s3pqexporter), whose persistent queue (file_storage on the pod's PVC) is
# the durable buffer (D19). Traces, logs and metrics (layout B, D7) go to
# manifest-less create-only slots under {S3_BASE}/{PRODUCER}/{signal}/, the
# layout the Rust consumer reads (--depth 2) and the Rust publishers write.
# As D4 requires (and s3pq's config validation enforces): the queue on
# file_storage, retry_on_failure.max_elapsed_time: 0, a timeout above the
# p99 PUT, and no batching after the queue. It does not batch at all: the
# agents send 10k-item requests, and batching here would merge different
# senders' requests, so a resent request would get a new content key (risk
# #10). Credentials: the AWS SDK's default chain (IRSA, Pod Identity,
# credential_process, static keys from the environment); AWS_CA_BUNDLE for a
# private CA; a custom endpoint (S3_BASE=https://host/bucket/prefix) is
# addressed path-style.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 128
      http:
        endpoint: 0.0.0.0:4318
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    directory: ${env:QUEUE_DIR:-/var/lib/otelcol/queue}
    create_directory: true
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:QUEUE_DIR:-/var/lib/otelcol/queue}
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
exporters:
  s3pq:
    producer_id: ${env:PRODUCER}
    lanes: 2                              # per signal; = the queue's consumers
    metrics_layout: series_table          # D7 (layout B); clickstack_tables for the contrib tables
    s3:
      url: ${env:S3_BASE}/${env:PRODUCER}
      region: ${env:S3_REGION}
      put_timeout: 10s
      head_timeout: 2s
    timeout: 30s                          # above put_timeout + head_timeout
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0                 # never drop from the queue
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 2
      sizer: requests
      queue_size: 5000                    # x ~10k items; the PVC is the bound
      # no `batch:` (risk #10; rejected by s3pq's validation)
service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [s3pq]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [s3pq]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [s3pq]

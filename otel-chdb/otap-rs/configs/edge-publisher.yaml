version: otel_dataflow/v1
# The deployed publisher (../../deploy/base/rust): edge-durable.yaml with a
# batch step in front of the durable buffer. Everything edge-durable.yaml's
# header says holds here; this file adds only the batching.
#
# Why batch here: the calculator and the consumer assume ~10,000-row objects
# (DECISIONS.md §1.2, D10), but what reaches a publisher is small. A node
# agent flushes on its 2 s timeout long before 10k items (a mid-scenario
# node makes ~150 spans/s), and the routing gateway (D16) cuts every request
# into one piece per publisher. Without this step a publisher writes one
# object per incoming request: ~300-row objects from agents, ~1,250-row
# pieces behind the gateway at N = 8 (../../deploy/results/route-*.txt).
#
# Why here and nowhere later: this is BEFORE the queue (the WAL), which is
# what D4 and risk #10 require. The batch's bytes are what the WAL keeps and
# replays, so a replay hashes to the same content key. What it gives up: a
# sender's resend of a request that already reached the WAL, but whose ack
# was lost (publisher crash in that window, a sender timeout, a routing
# gateway killed mid-request), lands in a different batch, so central keeps
# both copies (../../deploy/README.md §Duplicates, measured).
#
# Sizing (OTLP bytes: the batch processor sizes OTLP by bytes only):
# min_size 3 MiB is ~10k spans of testgen shape (320 B/span); max_size 8 MiB
# also splits an oversized request, deterministically, so no object nears
# the ~100k-row single-block limit (risk #11); max_batch_duration 1 s is
# D16's T = 1 s.
engine:
  http_admin:
    # /api/v1/livez, /api/v1/readyz, /metrics. The admin API also accepts
    # config and shutdown POSTs: never expose it beyond the pod network
    # (../../deploy uses a NetworkPolicy).
    bind_address: "${env:ADMIN_HTTP:-127.0.0.1:8080}"
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
    # Rejects ingress (retryable: 503 + Retry-After / RESOURCE_EXHAUSTED)
    # above the hard limit and fails readiness. Sampled as the process's RSS:
    # `auto` samples the cgroup's working set instead, which is right only
    # when the cgroup holds nothing else (in a shared cgroup it refused every
    # request here), and it refuses to start without explicit limits when
    # the cgroup has no memory.max. Set the limits below the container's
    # memory limit (../../deploy: 1 GiB / 1.5 GiB of 2 GiB).
    memory_limiter:
      mode: enforce
      source: "${env:MEM_SOURCE:-rss}"
      soft_limit: "${env:MEM_SOFT_LIMIT:-768MiB}"
      hard_limit: "${env:MEM_HARD_LIMIT:-1GiB}"
groups:
  default:
    pipelines:
      main:
        nodes:
          otlp_in:
            type: receiver:otlp
            config:
              protocols:
                grpc:
                  listening_addr: "${env:OTLP_GRPC:-127.0.0.1:14317}"
                  wait_for_result: true
                  timeout: "${env:OTLP_TIMEOUT:-30s}"
                  max_decoding_message_size: "${env:OTLP_MAX_BODY:-128MiB}"
                  # GOAWAY each agent connection after ~5 m (+/-10% per
                  # connection) so the agents re-resolve the headless
                  # Service and a scaled-up publisher gets its share
                  # (patches/0004; without it only an agent restart did).
                  # Requests in flight at the GOAWAY finish; the grace
                  # stays above `timeout` so none is cut unanswered (an
                  # unanswered request is resent: a duplicate here).
                  max_connection_age: "${env:OTLP_MAX_CONN_AGE:-5m}"
                  max_connection_age_grace: "${env:OTLP_MAX_CONN_AGE_GRACE:-45s}"
                http:
                  listening_addr: "${env:OTLP_HTTP:-127.0.0.1:14318}"
                  wait_for_result: true
                  timeout: "${env:OTLP_TIMEOUT:-30s}"
                  max_request_body_size: "${env:OTLP_MAX_BODY:-128MiB}"
          batch:
            type: processor:batch
            config:
              format: preserve                  # OTLP stays OTLP bytes (the direct walk)
              max_batch_duration: "${env:BATCH_MAX_DURATION:-1s}"
              otlp:
                sizer: bytes
                min_size: ${env:BATCH_MIN_BYTES:-3145728}
                max_size: ${env:BATCH_MAX_BYTES:-8388608}
          buffer:
            type: processor:durable_buffer
            config:
              path: "${env:BUFFER_DIR:-/var/lib/otap-s3pq/buffer}"
              retention_size_cap: "${env:BUFFER_CAP:-1 GiB}"
              size_cap_policy: backpressure
              otlp_handling: pass_through
              poll_interval: "${env:BUFFER_POLL:-100ms}"
              max_segment_open_duration: "${env:BUFFER_SEGMENT_OPEN:-1s}"
              initial_retry_interval: 1s
              max_retry_interval: 30s
          s3pq:
            type: exporter:s3pq
            config:
              cluster: "${env:CLUSTER:-local}"
              producer_id: "${env:PRODUCER:-edge-1}"
              lanes: ${env:LANES:-1}
              otlp_path: "${env:OTLP_PATH:-direct}"
              format: "${env:FORMAT:-parquet}"
              # series_table (layout B, D7: points tables + otel_metrics_series,
              # src/series.rs). clickstack_tables (contrib's five tables) stays
              # selectable for the benchmarks only.
              metrics_layout: "${env:METRICS_LAYOUT:-series_table}"
              parquet:
                sort:
                  by: none
              verbose: ${env:VERBOSE:-false}
              s3:
                url: "${env:S3_URL:-http://127.0.0.1:18333/otel/otap-rs/edge}"
                region: "${env:S3_REGION:-us-east-1}"
                put_timeout: "${env:PUT_TIMEOUT:-10s}"
                head_timeout: "2s"
        connections:
          - from: otlp_in
            to: batch
          - from: batch
            to: buffer
          - from: buffer
            to: s3pq

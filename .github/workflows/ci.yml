# The fast checks, on every push and pull request (ci/README.md).
name: ci

on:
  # A push that changes only Markdown (STPA/CAST rows, decisions, research notes) does not start
  # a run, so it cannot cancel the run verifying the code before it (CAST 51).
  push:
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

# Queue, don't cancel: with several writers on one branch, cancelling left no run finished for
# hours (CAST 51). A newer push waits for the running one; GitHub keeps only the newest pending run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.27.x"
  QUINT_VERSION: "0.32.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Every tagged test appends a record here when it finishes (ci/README.md, "Traceability");
  # each job uploads the file as trace-<job>, and the traceability job joins them.
  OSCOPE_TRACE_OUT: ${{ github.workspace }}/_trace/records.jsonl

jobs:
  go-vet:
    name: go vet (all modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-vet-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-vet-${{ runner.os }}-go${{ env.GO_VERSION }}-
      - run: ci/go-modules.sh vet all
      - name: IAM policies (a missing key must answer 404 under every role)
        run: ci/iam-lint.sh
      - name: IAM policies compiled from the Cedar grants (D38)
        run: ci/iam-lint.sh otel-chdb/grants/examples/out/iam
      - name: Traceability record (the IAM lint is CAST row 30's control)
        run: python3 ci/trace/trace.py record --test ci/iam-lint.sh --technique G --ids CAST-30,H-6,R-S7,SEC-2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-go-vet
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  go-test:
    name: go test (fast modules, -race)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-go${{ env.GO_VERSION }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install quint
        run: ci/install-quint.sh
      - name: Start SeaweedFS and ClickHouse
        run: ci/services.sh start
      - run: grep -Ev '^(#|$)' ci/test.env >> "$GITHUB_ENV"
      - name: go test
        env:
          RACE: "1"
          # The Go edge's DST (fake time, the SDK against an in-memory S3 over
          # httptest.NewTestServer): under -race it reports races between
          # the bubble's goroutines and requests still unwinding, at
          # mismatched addresses, that no ordering in the code explains
          # (research/go-verification.md, "synctest and -race"). The edge's
          # own packages keep -race.
          NORACE: otel-chdb/parquetgo/dst
          LOG_DIR: ${{ runner.temp }}/go-logs
        run: ci/go-modules.sh test fast
      - name: Service logs
        if: failure()
        run: ci/services.sh logs > "${{ runner.temp }}/go-logs/services.log" 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: go-test-logs
          path: ${{ runner.temp }}/go-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-go-test
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The lake UI's plain modules (planner client, range reader, completeness,
  # re-plan state machine, queries over edge Parquet fixtures), with their
  # property tests; and that vendor/ is what package-lock.json pins. No browser.
  lakeui:
    name: lake UI (node unit + property tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: otel-chdb/lakeui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: otel-chdb/lakeui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run vendor:check
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-lakeui
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # The Mosaic spike beside the lake UI (research/mosaic.md): its columns,
  # Arrow and completeness-layer tests import lakeui's modules, so both
  # directories are installed.
  lakeui-mosaic:
    name: lake UI Mosaic spike (node unit + property tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            otel-chdb/lakeui/package-lock.json
            otel-chdb/lakeui/mosaic/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: otel-chdb/lakeui
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: otel-chdb/lakeui/mosaic
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-lakeui-mosaic
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # otap-rs. This job owns the cargo cache (clippy's and the tests' release
  # artifacts); the nightly Rust jobs only restore it.
  rust:
    name: otap-rs (clippy, unit + integration tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: otel-chdb/otap-rs
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.ci/otel-arrow
      OTAPRS_DATA: ${{ github.workspace }}/.ci/data
      OTAPRS_SERIES_GO: ${{ github.workspace }}/.ci/data/series/go
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain && rustup component add clippy
      - uses: actions/cache@v6
        id: upstream
        with:
          path: .ci/otel-arrow
          key: otel-arrow-${{ hashFiles('otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
      - name: Upstream otel-arrow (pinned + patches)
        run: |
          if [ "${{ steps.upstream.outputs.cache-hit }}" = true ]; then
            ln -sfn "$UPSTREAM_DIR" .upstream
          else
            scripts/fetch-upstream.sh "$UPSTREAM_DIR"
          fi
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            otel-chdb/otap-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('otel-chdb/otap-rs/rust-toolchain.toml', 'otel-chdb/otap-rs/Cargo.lock', 'otel-chdb/otap-rs/UPSTREAM', 'otel-chdb/otap-rs/patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # Keyed by Go version: a key without it kept restoring (and re-saving)
      # the Go 1.26 build cache next to 1.27's, and with the cargo cache the
      # runner's disk filled during the restore (runs 133, 133 re-run: "No
      # space left on device" in the runner's own log).
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-rust-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('otel-chdb/otap-rs/tools/go.sum', 'otel-chdb/parquetgo/compare/go.sum') }}
          restore-keys: go-rust-${{ runner.os }}-go${{ env.GO_VERSION }}-
      - name: Start SeaweedFS and ClickHouse
        run: ../../ci/services.sh start
      - run: grep -Ev '^(#|$)' ../../ci/test.env >> "$GITHUB_ENV"
      - name: clippy (with the allow-list in ci/clippy.sh)
        run: ../../ci/clippy.sh
      - name: Traceability record (clippy -D warnings is CAST row 8's control)
        run: python3 ../../ci/trace/trace.py record --test ci/clippy.sh --technique G --ids CAST-8
      - name: Unit tests (lib and bins; the consumer's ClickHouse / S3 tests use the services)
        run: cargo test --release --locked --lib --bins
      - name: Datasets (otlpgen; the Go prototype's layout-B objects)
        env:
          SERIES: "1"
        run: ../../ci/gen-data.sh "$OTAPRS_DATA"
      - name: Integration tests (determinism, otap_view, metrics, series corr, resource_id and the payload offloader's vectors)
        run: cargo test --release --locked --test determinism --test otap_view --test metrics --test series --test resource_id --test offload
      - name: Deterministic simulation (otap-rs/DST.md; fixed seeds, the emulators against the services)
        run: cargo test --release --locked --test dst_consumer --test dst_net
      - name: Property and stateful tests (otap-rs/HEGEL.md; hegel.toml's ci profile, 100 derandomized cases each)
        env:
          HEGEL_CH: "1"
        run: cargo test --release --locked --test hegel_props --test hegel_dst
      - name: Service logs
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/rust-logs"
          ../../ci/services.sh logs > "${{ runner.temp }}/rust-logs/services.log" 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rust-logs
          path: ${{ runner.temp }}/rust-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-rust
          path: ${{ github.workspace }}/_trace
          if-no-files-found: warn

  # Requirements-to-test traceability from runtime evidence (ci/README.md, "Traceability"):
  # joins every job's trace records with the STPA catalogue and VERIFICATION.md's required
  # cells, and fails on a failed, skipped-only or unrun tagged test, an unknown ID or
  # technique, or a CAST row or required cell with no passing record that
  # ci/trace/known-gaps.txt does not list. Runs even when a test job failed, so the report
  # says which evidence is missing.
  traceability:
    name: traceability (tagged tests ran and passed at this commit)
    needs: [go-vet, go-test, lakeui, lakeui-mosaic, rust]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: trace-*
          path: ${{ runner.temp }}/trace
      - name: trace.py's own tests (a check that cannot fail is no check)
        run: python3 -m unittest -v ci/trace/trace_test.py
      - name: trace.py check
        run: |
          python3 ci/trace/trace.py check --workflow ci --jobs go-vet,go-test,lakeui,lakeui-mosaic,rust \
            --records "$RUNNER_TEMP/trace" --report "$RUNNER_TEMP/TRACEABILITY.md" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traceability-report
          path: ${{ runner.temp }}/TRACEABILITY.md
          if-no-files-found: warn


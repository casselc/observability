[package]
name = "otap-s3pq"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "otap-dataflow exporter: ClickStack-shaped Parquet on S3 with manifest-less create-only commits"

# Upstream otap-dataflow is used from a checkout at the commit in UPSTREAM,
# prepared by scripts/fetch-upstream.sh (shallow clone + patches/*.patch) and
# linked at .upstream (gitignored). Cargo.lock started as upstream's lock so
# every shared dependency resolves to the version upstream tests with.
[dependencies]
otel-arrow-dfe-config = { path = ".upstream/rust/otap-dataflow/crates/config" }
otel-arrow-dfe-controller = { path = ".upstream/rust/otap-dataflow/crates/controller" }
otel-arrow-dfe-engine = { path = ".upstream/rust/otap-dataflow/crates/engine" }
otel-arrow-dfe-otap = { path = ".upstream/rust/otap-dataflow/crates/otap", features = ["crypto-ring"] }
otel-arrow-dfe-pdata = { path = ".upstream/rust/otap-dataflow/crates/pdata" }
otel-arrow-dfe-pdata-views = { path = ".upstream/rust/otap-dataflow/crates/pdata-views" }
otel-arrow-dfe-telemetry = { path = ".upstream/rust/otap-dataflow/crates/telemetry" }
otel-arrow-dfe-telemetry-macros = { path = ".upstream/rust/otap-dataflow/crates/telemetry-macros" }
# The OTLP and OTAP receivers (and their exporters) of the core nodes, plus
# the durable buffer (Quiver) behind this crate's `durable-buffer` feature: no
# transform/query engine, no parquet exporter.
otel-arrow-dfe-core-nodes = { path = ".upstream/rust/otap-dataflow/crates/core-nodes", default-features = false, features = ["otlp", "otap"] }

arrow = { version = "58.3", default-features = false, features = ["ipc_compression"] }
parquet = { version = "58.3", default-features = false, features = ["arrow", "zstd"] }
object_store = { version = "0.13.2", default-features = false, features = ["aws"] }
async-trait = "0.1.88"
base64 = "0.22"
blake3 = "1.5.5"
bytes = "1.11.1"
futures = "0.3.32"
hex = "0.4.3"
humantime-serde = "1.1.1"
itoa = "1"
libc = "0.2"
url = "2.5.7"
http = "1.4"
linkme = "0.3.35"
rand = "0.10.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.48.0", features = ["rt", "time", "sync", "macros", "process", "fs", "net", "io-util"] }
tikv-jemallocator = { version = "0.7.0", optional = true }
# Layout B's series id (xxh3-64, as ../metrics-layout/seriesenc's zeebo/xxh3).
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
# SigV4 for STS AssumeRole (src/creds.rs); already in the graph via rustls/object_store.
ring = "0.17"

# tonic 0.14.6 plus patches/tonic-*.patch (Server::max_connection_age: a
# GOAWAY at the age, the grace after it, +/-10% jitter), which patches/0004
# relies on; prepared by scripts/fetch-upstream.sh inside the upstream clone.
[patch.crates-io]
tonic = { path = ".upstream/.otap-rs/tonic" }

[features]
default = ["jemalloc", "durable-buffer"]
jemalloc = ["dep:tikv-jemallocator"]
# processor:durable_buffer (upstream's Quiver WAL + segments) in otap-s3pq.
durable-buffer = ["otel-arrow-dfe-core-nodes/durable-buffer"]

[profile.release]
# Iterating: no LTO. `--profile dist` for the size/speed numbers.
lto = false
codegen-units = 16
debug = false

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "otap-s3pq"
path = "src/main.rs"

[dev-dependencies]
quint-connect = "0.1.2"
itf = "0.4"
anyhow = "1"
tokio = { version = "1.48.0", features = ["rt", "macros", "time", "test-util"] }
# The deterministic simulation tests (DST.md): a simulated network, and
# HTTP over it for object_store's S3 client and the ClickHouse client.
turmoil = "=0.7.2"
hyper = { version = "1.11", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
# Property, stateful and swarm tests (HEGEL.md). Hegel is Hypothesis for
# Rust; `static-engine` links the engine (hegeltest-c, pure Rust) into the
# test binaries instead of loading libhegel_c at run time, so the tests build
# and run offline once the crates are fetched. Pinned exactly: Hegel is in
# beta and may break its API between releases.
hegeltest = { version = "=0.47.4", features = ["static-engine"] }
# Building OTLP requests in the property tests (already in the graph via pdata).
prost = "0.14"

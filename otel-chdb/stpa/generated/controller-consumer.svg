    <text x="96" y="100" font-size="12" class="f-quiet">leases, time-bound inserts, count check and repair</text>
    <rect x="90" y="112" width="294" height="618" rx="6" stroke="none" class="f-tint"/>
    <text x="96" y="128" font-size="12" font-weight="600" class="f-quiet">CONTROL ALGORITHM</text>
    <rect x="388" y="112" width="294" height="618" rx="6" stroke="none" class="f-tint"/>
    <text x="394" y="128" font-size="12" font-weight="600" class="f-quiet">PROCESS MODEL</text>
    <text x="96" y="150" font-weight="600" font-size="12" class="f-ink">take or renew the lease</text>
    <text x="96" y="166" font-size="12" class="f-ink">▸ checkpoints, CAS leases</text>
    <text x="96" y="182" font-size="12" class="f-quiet">when the lane's lease is free or expired on</text>
    <text x="96" y="198" font-size="12" class="f-quiet">this worker's own clock and the fair share</text>
    <text x="96" y="214" font-size="12" class="f-quiet">wants it; or the held lease is due for</text>
    <text x="96" y="230" font-size="12" class="f-quiet">renewal</text>
    <text x="96" y="254" font-weight="600" font-size="12" class="f-ink">advance the checkpoint</text>
    <text x="96" y="270" font-size="12" class="f-ink">▸ checkpoints</text>
    <text x="96" y="286" font-size="12" class="f-quiet">when every statement of a prefix is settled</text>
    <text x="96" y="302" font-size="12" class="f-quiet">and counted: advance the checkpoint (and</text>
    <text x="96" y="318" font-size="12" class="f-quiet">the watermark); a lane whose custody is</text>
    <text x="96" y="334" font-size="12" class="f-quiet">proved empty is retired</text>
    <text x="96" y="358" font-weight="600" font-size="12" class="f-ink">insert a batch</text>
    <text x="96" y="374" font-size="12" class="f-ink">▸ insert</text>
    <text x="96" y="390" font-size="12" class="f-quiet">when the lease is held, now + budget &lt;=</text>
    <text x="96" y="406" font-size="12" class="f-quiet">safe_until, objects are pending and no</text>
    <text x="96" y="422" font-size="12" class="f-quiet">statement of the lane is unresolved</text>
    <text x="96" y="446" font-weight="600" font-size="12" class="f-ink">repair a short count</text>
    <text x="96" y="462" font-size="12" class="f-ink">▸ repair</text>
    <text x="96" y="478" font-size="12" class="f-quiet">when a settled statement's objects are</text>
    <text x="96" y="494" font-size="12" class="f-quiet">short in central's counts</text>
    <text x="394" y="278" font-weight="600" font-size="12" class="f-ink">lease  ◂ list, get</text>
    <text x="394" y="294" font-size="12" class="f-quiet">Whether this worker holds the lane's lease,</text>
    <text x="394" y="310" font-size="12" class="f-quiet">its epoch, and until when it is safe to act</text>
    <text x="394" y="326" font-size="12" class="f-quiet">(safe_until, on its own monotonic clock)</text>
    <text x="394" y="606" font-weight="600" font-size="12" class="f-ink">fence</text>
    <text x="394" y="622" font-size="12" class="f-quiet">The deadline a statement carries, evaluated</text>
    <text x="394" y="638" font-size="12" class="f-quiet">on ClickHouse's clock: sent + ttl - margin</text>
    <text x="394" y="654" font-size="12" class="f-quiet">- budget (D9)</text>
    <text x="394" y="670" font-size="12" font-style="italic" class="f-quiet">no feedback: computed from the lease</text>
    <text x="394" y="686" font-size="12" font-style="italic" class="f-quiet">write's send time, the TTL and the margin</text>
    <text x="394" y="702" font-size="12" font-style="italic" class="f-quiet">(at least 20 s, checked against the Keeper</text>
    <text x="394" y="718" font-size="12" font-style="italic" class="f-quiet">session at start)</text>
    <text x="394" y="350" font-weight="600" font-size="12" class="f-ink">checkpoint  ◂ list, get</text>
    <text x="394" y="366" font-size="12" class="f-quiet">The lane's checkpoint as stored: lease</text>
    <text x="394" y="382" font-size="12" class="f-quiet">epoch, version, floor and epochs (D8)</text>
    <text x="394" y="406" font-weight="600" font-size="12" class="f-ink">pending_objects  ◂ list, get</text>
    <text x="394" y="422" font-size="12" class="f-quiet">The lane's objects past the checkpoint, in</text>
    <text x="394" y="438" font-size="12" class="f-quiet">custody order</text>
    <text x="394" y="150" font-weight="600" font-size="12" class="f-ink">statement  ◂ answers</text>
    <text x="394" y="166" font-size="12" class="f-quiet">Each statement's outcome: committed, not</text>
    <text x="394" y="182" font-size="12" class="f-quiet">applied, or unresolved until it can no</text>
    <text x="394" y="198" font-size="12" class="f-quiet">longer land</text>
    <text x="394" y="222" font-weight="600" font-size="12" class="f-ink">row_counts  ◂ counts</text>
    <text x="394" y="238" font-size="12" class="f-quiet">How many rows of each object central holds,</text>
    <text x="394" y="254" font-size="12" class="f-quiet">by content key (D11)</text>
    <text x="394" y="462" font-weight="600" font-size="12" class="f-ink">complete_through  ◂ list, get</text>
    <text x="394" y="478" font-size="12" class="f-quiet">The lane's watermark: the custody time up</text>
    <text x="394" y="494" font-size="12" class="f-quiet">to which everything the edge held is</text>
    <text x="394" y="510" font-size="12" class="f-quiet">ingested (D29)</text>
    <text x="394" y="534" font-weight="600" font-size="12" class="f-ink">lane_closed  ◂ list, get</text>
    <text x="394" y="550" font-size="12" class="f-quiet">Whether every incarnation of the lane's</text>
    <text x="394" y="566" font-size="12" class="f-quiet">edge has closed or been tombstoned, so its</text>
    <text x="394" y="582" font-size="12" class="f-quiet">custody is empty (D35)</text>

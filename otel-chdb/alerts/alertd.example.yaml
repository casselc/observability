# alertd's configuration (README §1). Secrets come from the environment:
# the client secrets named by client_secret_env, the state bucket's keys from
# the AWS default chain (IRSA, Pod Identity) unless access_key is set.
listen: ":18191"
rules_file: rules.example.yaml
replica: ""                     # default: the host name (the pod name)
query:
  url: http://query:18190       # the query service (otel-chdb/query)
  timeout_s: 60
# The evaluator's own service identities at the IdP the query service trusts.
# A rule names one (default "default"); the token's clusters and namespaces
# are the rule's scope.
identities:
  default:                      # fleet scope: map its group to "*" in queryd's group_grants
    token_url: https://idp.example.com/realms/observability/protocol/openid-connect/token
    client_id: alertd
    client_secret_env: ALR_CLIENT_SECRET
    audience: otel-query
  team-shop:                    # a team's rules run with the team's scope
    token_file: /var/run/secrets/tokens/alertd-team-shop
state:                          # one object per rule, replaced by compare-and-swap (README §4)
  endpoint: http://seaweedfs:8333
  bucket: otel
  prefix: alerts/state
sink:
  url: http://alertmanager:9093/api/v2/alerts
  format: alertmanager          # or webhook: {version, alerts: [{dedup_key, status, labels, ...}]}
  timeout_s: 10
evaluation:
  tick_s: 15
  max_windows_per_tick: 20      # the catch-up rate after downtime
  lateness_s: 30                # a window is evaluated once complete_through >= its end + the service's max_lateness + this
  cannot_evaluate_after_s: 300  # DECISIONS "owner decisions": alerts ~5 min behind accepted
  failures_to_page: 3
  max_backlog_s: 21600          # windows older than this after an outage are skipped (and counted)
  refresh_s: 60                 # Alertmanager forgets alerts not re-sent
  hold_resolved_s: 45           # > Alertmanager's group_wait
  backoff_base_s: 2
  backoff_max_s: 120
  concurrency: 4

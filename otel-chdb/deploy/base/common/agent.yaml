# The node agent: one Go collector per node (collector/builder-config.yaml).
# Applications send OTLP to the Service otel-agent (internalTrafficPolicy:
# Local keeps it on the node). The agent batches to 10,000 items BEFORE its
# persistent queue (risk #10, risk #11), keeps the queue on the node's disk,
# and retries forever (max_elapsed_time: 0): it is the custodian of anything
# the publishers have not acknowledged.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: otel-agent
  labels:
    app.kubernetes.io/name: otel-agent
spec:
  selector:
    app.kubernetes.io/name: otel-agent
  internalTrafficPolicy: Local
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-agent
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: otel-agent
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # hostPath volumes are root-owned; hand the queue directory to the agent.
        - name: queue-dir
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /queue && chown 10001:10001 /queue"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: queue
              mountPath: /queue
      containers:
        - name: agent
          image: otelcol-deploy:v0.161.0   # collector/build.sh; set with `images:` in an overlay
          args: ["--config=/etc/otel-agent/agent.yaml"]
          env:
            - name: GOMEMLIMIT
              value: 400MiB
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otel-agent
            - name: queue
              mountPath: /var/lib/otel-agent/queue
      volumes:
        - name: config
          configMap:
            name: otel-agent
        # The persistent queue survives agent restarts and upgrades (not a
        # node's loss). Budget: sending_queue.queue_size requests of up to
        # ~10k items (~8 MB each on disk) per node: ~2 GB per queue.
        - name: queue
          hostPath:
            path: /var/lib/otel-agent/queue
            type: DirectoryOrCreate

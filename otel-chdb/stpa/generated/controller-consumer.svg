    <text x="394" y="127" font-size="10.5" font-weight="600" class="f-quiet">PROCESS MODEL</text>
    <text x="96" y="149" font-weight="600" font-size="12" class="f-ink">checkpoints, CAS leases</text>
    <text x="96" y="164" font-size="11.5" class="f-quiet">when the lane's lease is free or expired on</text>
    <text x="96" y="179" font-size="11.5" class="f-quiet">this worker's own clock and the fair share</text>
    <text x="96" y="194" font-size="11.5" class="f-quiet">wants it; or the held lease is due for</text>

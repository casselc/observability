    <text x="394" y="315" font-size="11.5" class="f-quiet">(safe_until, on its own monotonic clock)</text>
    <text x="394" y="580" font-weight="600" font-size="12" class="f-ink">fence</text>
    <text x="394" y="595" font-size="11.5" class="f-quiet">The deadline a statement carries, evaluated</text>

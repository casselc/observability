version: otel_dataflow/v1
# The lean edge: OTLP receiver (gRPC + HTTP, responds only after the S3
# commit resolves) -> exporter:s3pq (ClickStack Parquet, create-only slots).
# No durable buffer: custody stays with the sender until the commit, and an
# S3 outage pushes back to it (retryable 503 / UNAVAILABLE). The sender must
# therefore retry forever from a persistent queue. This is the configuration
# the benchmarks and fault scripts measure; ../../deploy runs
# edge-publisher.yaml.
# Sorting off, layout B, no batching, no keys: as edge-durable.yaml.
engine:
  http_admin:
    # /api/v1/livez, /api/v1/readyz, /metrics (and config/shutdown POSTs:
    # keep it off shared networks).
    bind_address: "${env:ADMIN_HTTP:-127.0.0.1:8080}"
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
    # See edge-durable.yaml: the process's RSS against explicit limits,
    # retryable rejection above the hard limit.
    memory_limiter:
      mode: enforce
      source: "${env:MEM_SOURCE:-rss}"
      soft_limit: "${env:MEM_SOFT_LIMIT:-768MiB}"
      hard_limit: "${env:MEM_HARD_LIMIT:-1GiB}"
groups:
  default:
    pipelines:
      main:
        nodes:
          otlp_in:
            type: receiver:otlp
            config:
              protocols:
                grpc:
                  listening_addr: "${env:OTLP_GRPC:-127.0.0.1:14317}"
                  wait_for_result: true
                  timeout: "${env:OTLP_TIMEOUT:-30s}"
                  max_decoding_message_size: "${env:OTLP_MAX_BODY:-128MiB}"
                http:
                  listening_addr: "${env:OTLP_HTTP:-127.0.0.1:14318}"
                  wait_for_result: true
                  timeout: "${env:OTLP_TIMEOUT:-30s}"
                  max_request_body_size: "${env:OTLP_MAX_BODY:-128MiB}"
          s3pq:
            type: exporter:s3pq
            config:
              cluster: "${env:CLUSTER:-local}"
              producer_id: "${env:PRODUCER:-edge-1}"
              lanes: ${env:LANES:-1}
              otlp_path: "${env:OTLP_PATH:-direct}"
              format: "${env:FORMAT:-parquet}"
              # series_table (layout B, D7: points tables + otel_metrics_series,
              # src/series.rs); clickstack_tables for the benchmarks only.
              metrics_layout: "${env:METRICS_LAYOUT:-series_table}"
              verbose: ${env:VERBOSE:-false}
              parquet:
                sort:
                  by: none              # D16: sorting off
              s3:
                # No keys here: the default chain (edge-durable.yaml's header).
                url: "${env:S3_URL:-http://127.0.0.1:18333/otel/otap-rs/edge}"
                region: "${env:S3_REGION:-us-east-1}"
                put_timeout: "${env:PUT_TIMEOUT:-10s}"
                head_timeout: "2s"
        connections:
          - from: otlp_in
            to: s3pq

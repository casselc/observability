# otelcol-awss3 publishers (Go edge). A StatefulSet for the same reasons as
# the Rust one: the persistent sending queue lives on the pod's PVC, and the
# producer id (CLUSTER-otelcol-publisher-N) must be stable per volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelcol-publisher
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: otelcol-publisher
  labels:
    app.kubernetes.io/name: otelcol-publisher
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: otelcol-publisher
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otelcol-publisher
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcol-publisher
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: otelcol-publisher
  labels:
    app.kubernetes.io/name: otelcol-publisher
    app.kubernetes.io/component: publisher
spec:
  serviceName: otelcol-publisher
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcol-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otelcol-publisher
        app.kubernetes.io/component: publisher
    spec:
      serviceAccountName: otelcol-publisher
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: otelcol-publisher
      containers:
        - name: otelcol
          image: otelcol-awss3:v0.161.0    # images/otelcol-awss3.Dockerfile; set with `images:`
          args: ["--config=/etc/otelcol/publisher.yaml"]
          envFrom:
            - configMapRef:
                name: edge-target
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PRODUCER
              value: "$(CLUSTER)-$(POD_NAME)"
            - name: AWS_REGION
              value: "$(S3_REGION)"
            - name: QUEUE_DIR
              value: /var/lib/otelcol/queue
            - name: GOMEMLIMIT
              value: 1600MiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: queue
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: otelcol-publisher
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

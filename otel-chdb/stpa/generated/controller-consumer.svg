    <text x="96" y="232" font-weight="600" font-size="12" class="f-ink">checkpoints</text>
    <text x="96" y="247" font-size="11.5" class="f-quiet">when every statement of a prefix is settled</text>
    <text x="96" y="262" font-size="11.5" class="f-quiet">and counted: advance the checkpoint (and the</text>
    <text x="96" y="277" font-size="11.5" class="f-quiet">watermark); a lane whose custody is proved</text>
    <text x="96" y="292" font-size="11.5" class="f-quiet">empty is retired</text>
    <text x="96" y="315" font-weight="600" font-size="12" class="f-ink">insert</text>
    <text x="96" y="330" font-size="11.5" class="f-quiet">when the lease is held, now + budget &lt;=</text>
    <text x="96" y="345" font-size="11.5" class="f-quiet">safe_until, objects are pending and no</text>
    <text x="96" y="360" font-size="11.5" class="f-quiet">statement of the lane is unresolved</text>
    <text x="96" y="383" font-weight="600" font-size="12" class="f-ink">repair</text>
    <text x="96" y="398" font-size="11.5" class="f-quiet">when a settled statement's objects are short</text>
    <text x="96" y="413" font-size="11.5" class="f-quiet">in central's counts</text>
    <text x="394" y="270" font-weight="600" font-size="12" class="f-ink">lease  ◂ list, get</text>
    <text x="394" y="285" font-size="11.5" class="f-quiet">Whether this worker holds the lane's lease,</text>

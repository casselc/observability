# Node agent -> Go publishers (every signal: the s3pq exporter publishes
# metrics as layout B, as the Rust publishers do). The rules that matter
# (DECISIONS.md D4, risks #10 and #11):
# - NO `batch` processor, and never `sending_queue.batch`: the receiver
#   answers the sender only once the request is in the persistent queue.
#   The batch processor is asynchronous: the receiver acks as soon as the
#   batcher takes a request, so a SIGKILL (OOM kill, crash) lost every
#   acked request not yet written to the queue (1-5 of 32 10k-item
#   requests per kill on kind, deploy/results/k8s-sim.md §8). The publisher
#   batches before its own queue instead (publisher-config.yaml: s3pq
#   `batch`, 10,000 items or 1 s, larger requests split at 10,000, the ack
#   after the enqueue), so a queue item here is still one request whose
#   bytes, and so content key, survive resends;
# - the persistent queue on the node (file_storage) and
#   retry_on_failure.max_elapsed_time: 0: nothing leaves the queue until a
#   publisher acknowledged it (after its queue write), however long S3 or
#   the publishers are down.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    directory: /var/lib/otel-agent/queue
    create_directory: true
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otel-agent/queue
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
exporters:
  otlp_grpc/publishers:
    # Headless Service: the agent resolves every ready publisher and
    # round-robins requests over them.
    endpoint: dns:///otelcol-publisher.otel-edge.svc.cluster.local:4317
    balancer_name: round_robin
    tls:
      insecure: true            # in-cluster; see README §Security for mTLS
    compression: none
    timeout: 60s                # a publisher acks after its queue write (<= its 1 s batch window + ms)
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0       # never drop: retry until a publisher acks
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 4
      # items, not requests: without a batch step a request is whatever the
      # SDK sent (often a few hundred items). ~800 B of bbolt per item
      # (measured: 261 MB for 320k): ~2 GB of node disk, ~80 min of a
      # mid-scenario node (~500 items/s).
      sizer: items
      queue_size: 2500000
      # no `batch:` here (risk #10)
service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_grpc/publishers]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_grpc/publishers]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_grpc/publishers]

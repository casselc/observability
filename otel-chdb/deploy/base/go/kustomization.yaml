# The Go edge (kept by DECISIONS.md D1): otelcol-s3pq
# (../../../awss3/collector/builder-config.yaml) running the s3pq exporter
# (../../../parquetgo/s3pqexporter): manifest-less create-only slots for
# traces, logs and metrics (layout B: points lanes plus metrics_series,
# announced only after its commit), the Rust publishers' objects, keys and
# metadata, so the one consumer reads both (../../../conformance). The agents
# send every signal.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-edge
resources:
  - ../common
  - publisher.yaml
configMapGenerator:
  - name: otelcol-publisher
    files:
      - publisher.yaml=publisher-config.yaml
  - name: otel-agent
    files:
      - agent.yaml=agent-go.yaml

# go edge on eks-irsa: ../../README.md. Every value to set is marked CHANGE-ME.
#   kustomize build --load-restrictor LoadRestrictionsNone . | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-edge
resources:
  - ../../base/go
components:
  - ../../components/eks-irsa
configMapGenerator:
  - name: edge-target
    behavior: merge
    literals:
      - CLUSTER=prod-eu-west-1-a
      - S3_BUCKET=CHANGE-ME-telemetry
      - S3_REGION=eu-west-1
      - S3_BASE=s3://CHANGE-ME-telemetry/edge
images:
  - name: otelcol-s3pq
    newName: REGISTRY/otelcol-s3pq
    newTag: v0.161.0
  - name: otelcol-deploy
    newName: REGISTRY/otelcol-deploy
    newTag: v0.161.0
patches:
  # IRSA: the role the webhook injects. Its trust policy:
  # ../../../acceptance/iam/trust-irsa.example.json with
  # sub = system:serviceaccount:otel-edge:otelcol-publisher; its permissions:
  # ../../../acceptance/iam/s3-policy.json.
  - target:
      kind: ServiceAccount
      name: otelcol-publisher
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/CHANGE-ME-otel-edge-publisher
          eks.amazonaws.com/sts-regional-endpoints: "true"

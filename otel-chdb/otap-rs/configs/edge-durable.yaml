version: otel_dataflow/v1
# The durable edge: OTLP receiver -> processor:durable_buffer (upstream's
# Quiver: WAL + segments) -> exporter:s3pq. One object per incoming request,
# which scripts/durable.sh relies on. The deployed publisher
# (../../deploy/base/rust) is edge-publisher.yaml: this plus a batch step
# before the buffer.
#
# Delivery contract (DECISIONS.md D3, D19; README §Edge durability):
# - the client's 2xx follows the WAL write, not the S3 commit. The buffer
#   forwards finalized segments to the exporter, deletes a bundle only when
#   the exporter ACKs it (after the create-only commit), and replays what is
#   left after a restart. A replay is the same OTLP bytes, so the same
#   content key: central drops a copy whose first commit had landed.
# - received_at is the WAL write (patches/0003: Quiver keeps each bundle's
#   ingestion time in its segment and hands it to the exporter), so a
#   replay after any outage lands in its original's toDate(received_at)
#   partition and the consumer's count check finds it; the exporter's own
#   clock only without a buffer (edge.yaml). scripts/replay_received.sh.
# - retries never give up: a retryable NACK (S3 down, 403 on an expired
#   credential, timeouts) is retried with backoff (1 s .. 30 s) with no
#   deadline; `max_age` is deliberately unset (an age limit would delete
#   unsent data).
# - disk full: `size_cap_policy: backpressure`. At `retention_size_cap` the
#   buffer refuses new data and the receiver answers 503 (retryable), so
#   custody stays with the sender (the node agents' persistent queue); every
#   acked request is committed later. `drop_oldest` keeps acking and deletes
#   the oldest segments: 47 of 64 acked requests were lost in the test. Keep
#   the cap well below the volume: if the filesystem fills first, ingest
#   still fails retryably, but a restart cannot replay the WAL and the
#   process exits until the volume is grown (nothing acked is lost, it is
#   stuck). ../../deploy/results/durable-diskfull.txt has all three.
#   Size the cap for the S3 outage the publisher must ride out: about 315 B
#   of segment per span (half of the 630 B written: WAL + segment); the
#   engine's minimum is 192 MiB per core (WAL 128 MiB + 2 segments), and the
#   volume should be ~25% above the cap.
# - no batching here, and never between the queue and the exporter: the
#   content key hashes what the WAL holds, so a replay keeps its key
#   (risk #10). Senders batch to at most 10,000 items before their own
#   queue (risk #11: ../../deploy/base/rust/agent-rust.yaml);
#   edge-publisher.yaml batches in front of the WAL, never behind it.
# - no sorting (D16): `parquet.sort.by: none`.
# - metrics: layout B (D7), one lane per points type plus the series lane.
# - credentials: none in this file. object_store's default chain plus
#   src/creds.rs: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (static keys, e.g.
#   from a Secret), IRSA (AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE), EKS Pod
#   Identity (AWS_CONTAINER_CREDENTIALS_FULL_URI + token file), AWS_PROFILE /
#   credential_process, or IMDS (`aws_signing_helper serve`:
#   AWS_EC2_METADATA_SERVICE_ENDPOINT). A private CA: AWS_CA_BUNDLE.
engine:
  http_admin:
    # /api/v1/livez, /api/v1/readyz, /metrics. The admin API also accepts
    # config and shutdown POSTs: never expose it beyond the pod network
    # (../../deploy uses a NetworkPolicy).
    bind_address: "${env:ADMIN_HTTP:-127.0.0.1:8080}"
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
    # Rejects ingress (retryable: 503 + Retry-After / RESOURCE_EXHAUSTED)
    # above the hard limit and fails readiness. Sampled as the process's RSS:
    # `auto` samples the cgroup's working set instead, which is right only
    # when the cgroup holds nothing else (in a shared cgroup it refused every
    # request here), and it refuses to start without explicit limits when
    # the cgroup has no memory.max. Set the limits below the container's
    # memory limit (../../deploy: 1 GiB / 1.5 GiB of 2 GiB).
    memory_limiter:
      mode: enforce
      source: "${env:MEM_SOURCE:-rss}"
      soft_limit: "${env:MEM_SOFT_LIMIT:-768MiB}"
      hard_limit: "${env:MEM_HARD_LIMIT:-1GiB}"
groups:
  default:
    pipelines:
      main:
        nodes:
          otlp_in:
            type: receiver:otlp
            config:
              protocols:
                grpc:
                  listening_addr: "${env:OTLP_GRPC:-127.0.0.1:14317}"
                  wait_for_result: true
                  timeout: "${env:OTLP_TIMEOUT:-30s}"
                  max_decoding_message_size: "${env:OTLP_MAX_BODY:-128MiB}"
                  # See edge-publisher.yaml (patches/0004).
                  max_connection_age: "${env:OTLP_MAX_CONN_AGE:-5m}"
                  max_connection_age_grace: "${env:OTLP_MAX_CONN_AGE_GRACE:-45s}"
                http:
                  listening_addr: "${env:OTLP_HTTP:-127.0.0.1:14318}"
                  wait_for_result: true
                  timeout: "${env:OTLP_TIMEOUT:-30s}"
                  max_request_body_size: "${env:OTLP_MAX_BODY:-128MiB}"
          buffer:
            type: processor:durable_buffer
            config:
              path: "${env:BUFFER_DIR:-/var/lib/otap-s3pq/buffer}"
              retention_size_cap: "${env:BUFFER_CAP:-1 GiB}"
              size_cap_policy: backpressure
              otlp_handling: pass_through
              poll_interval: "${env:BUFFER_POLL:-100ms}"
              max_segment_open_duration: "${env:BUFFER_SEGMENT_OPEN:-1s}"
              initial_retry_interval: 1s
              max_retry_interval: 30s
          s3pq:
            type: exporter:s3pq
            config:
              producer_id: "${env:PRODUCER:-edge-1}"
              lanes: ${env:LANES:-1}
              otlp_path: "${env:OTLP_PATH:-direct}"
              format: "${env:FORMAT:-parquet}"
              # series_table (layout B, D7: points tables + otel_metrics_series,
              # src/series.rs). clickstack_tables (contrib's five tables) stays
              # selectable for the benchmarks only.
              metrics_layout: "${env:METRICS_LAYOUT:-series_table}"
              parquet:
                sort:
                  by: none
              verbose: ${env:VERBOSE:-false}
              s3:
                url: "${env:S3_URL:-http://127.0.0.1:18333/otel/otap-rs/edge}"
                region: "${env:S3_REGION:-us-east-1}"
                put_timeout: "${env:PUT_TIMEOUT:-10s}"
                head_timeout: "2s"
        connections:
          - from: otlp_in
            to: buffer
          - from: buffer
            to: s3pq

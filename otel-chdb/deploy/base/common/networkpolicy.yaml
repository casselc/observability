# Publishers take OTLP only from inside this namespace (the agents, and the
# gateway when components/routing is on). The admin port (8080: probes,
# /metrics, and the engine's config and shutdown POSTs) is open only to a
# namespace labelled otel-edge/monitoring=true; the kubelet's probes are
# node-local and not subject to NetworkPolicy on the common CNIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publishers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: publisher
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 4317
        - port: 4318
    - from:
        - namespaceSelector:
            matchLabels:
              otel-edge/monitoring: "true"
      ports:
        - port: 8080
        - port: 8888

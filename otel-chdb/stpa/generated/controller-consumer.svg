    <text x="96" y="82" font-weight="600" class="f-ink">Consumer workers</text>
    <text x="96" y="100" font-size="12" class="f-quiet">leases, time-bound inserts, count check and repair</text>
    <rect x="90" y="112" width="294" height="874" rx="6" stroke="none" class="f-tint"/>
    <text x="96" y="128" font-size="12" font-weight="600" class="f-quiet">CONTROL ALGORITHM</text>
    <rect x="388" y="112" width="294" height="874" rx="6" stroke="none" class="f-tint"/>
    <text x="394" y="128" font-size="12" font-weight="600" class="f-quiet">PROCESS MODEL</text>
    <text x="96" y="150" font-weight="600" font-size="12" class="f-ink">take or renew the lease</text>
    <text x="96" y="166" font-size="12" class="f-ink">▸ checkpoints, CAS leases</text>
    <text x="96" y="182" font-size="12" class="f-quiet">when the lane's lease is free or expired on</text>
    <text x="96" y="198" font-size="12" class="f-quiet">this worker's own clock and the fair share</text>
    <text x="96" y="214" font-size="12" class="f-quiet">wants it; or the held lease is due for</text>
    <text x="96" y="230" font-size="12" class="f-quiet">renewal</text>
    <text x="96" y="254" font-weight="600" font-size="12" class="f-ink">advance the checkpoint</text>
    <text x="96" y="270" font-size="12" class="f-ink">▸ checkpoints</text>
    <text x="96" y="286" font-size="12" class="f-quiet">when every statement of a prefix is settled</text>
    <text x="96" y="302" font-size="12" class="f-quiet">and counted: advance the checkpoint (and</text>
    <text x="96" y="318" font-size="12" class="f-quiet">the watermark); a lane whose custody is</text>
    <text x="96" y="334" font-size="12" class="f-quiet">proved empty is retired</text>
    <text x="96" y="358" font-weight="600" font-size="12" class="f-ink">insert a batch</text>
    <text x="96" y="374" font-size="12" class="f-ink">▸ insert</text>
    <text x="96" y="390" font-size="12" class="f-quiet">when the lease is held, now + budget &lt;=</text>
    <text x="96" y="406" font-size="12" class="f-quiet">safe_until, objects are pending and no</text>
    <text x="96" y="422" font-size="12" class="f-quiet">statement of the lane is unresolved</text>
    <text x="96" y="446" font-weight="600" font-size="12" class="f-ink">repair a short count</text>
    <text x="96" y="462" font-size="12" class="f-ink">▸ repair</text>
    <text x="96" y="478" font-size="12" class="f-quiet">when a settled statement's objects are</text>
    <text x="96" y="494" font-size="12" class="f-quiet">short in central's counts</text>
    <text x="394" y="278" font-weight="600" font-size="12" class="f-ink">lease  ◂ list, get</text>
    <text x="394" y="294" font-size="12" class="f-quiet">Whether this worker holds the lane's lease,</text>
    <text x="394" y="310" font-size="12" class="f-quiet">its epoch, and until when it is safe to act</text>
    <text x="394" y="326" font-size="12" class="f-quiet">(safe_until, on its own monotonic clock);</text>
    <text x="394" y="342" font-size="12" class="f-quiet">and its renewals that got no answer and</text>
    <text x="394" y="358" font-size="12" class="f-quiet">read back unchanged, which may still land</text>
    <text x="394" y="374" font-size="12" class="f-quiet">(unsure: before its lapse check and next</text>
    <text x="394" y="390" font-size="12" class="f-quiet">renewal it reads the lease back and adopts</text>
    <text x="394" y="406" font-size="12" class="f-quiet">one it finds stored, by owner, epoch and</text>
    <text x="394" y="422" font-size="12" class="f-quiet">beat, CAST-74); and its takes that got no</text>
    <text x="394" y="438" font-size="12" class="f-quiet">answer and read back the version they were</text>
    <text x="394" y="454" font-size="12" class="f-quiet">conditional on, which may still land and</text>
    <text x="394" y="470" font-size="12" class="f-quiet">make the store name it holder of a lane it</text>
    <text x="394" y="486" font-size="12" class="f-quiet">does not hold (unsure: at each step's</text>
    <text x="394" y="502" font-size="12" class="f-quiet">start, in try_take's read and on a later</text>
    <text x="394" y="518" font-size="12" class="f-quiet">take's 412 it reads the lease back and</text>
    <text x="394" y="534" font-size="12" class="f-quiet">adopts one it finds stored, by owner, epoch</text>
    <text x="394" y="550" font-size="12" class="f-quiet">and beat, holding from the take's send and</text>
    <text x="394" y="566" font-size="12" class="f-quiet">fencing the checkpoint, or gives it back if</text>
    <text x="394" y="582" font-size="12" class="f-quiet">its window is over, CAST-83)</text>
    <text x="394" y="862" font-weight="600" font-size="12" class="f-ink">fence</text>
    <text x="394" y="878" font-size="12" class="f-quiet">The deadline a statement carries, evaluated</text>
    <text x="394" y="894" font-size="12" class="f-quiet">on ClickHouse's clock: sent + ttl - margin</text>
    <text x="394" y="910" font-size="12" class="f-quiet">- budget (D9)</text>
    <text x="394" y="926" font-size="12" font-style="italic" class="f-quiet">no feedback: computed from the lease</text>
    <text x="394" y="942" font-size="12" font-style="italic" class="f-quiet">write's send time, the TTL and the margin</text>
    <text x="394" y="958" font-size="12" font-style="italic" class="f-quiet">(at least 20 s, checked against the Keeper</text>
    <text x="394" y="974" font-size="12" font-style="italic" class="f-quiet">session at start)</text>
    <text x="394" y="606" font-weight="600" font-size="12" class="f-ink">checkpoint  ◂ list, get</text>
    <text x="394" y="622" font-size="12" class="f-quiet">The lane's checkpoint as stored: lease</text>
    <text x="394" y="638" font-size="12" class="f-quiet">epoch, version, floor and epochs (D8)</text>
    <text x="394" y="662" font-weight="600" font-size="12" class="f-ink">pending_objects  ◂ list, get</text>
    <text x="394" y="678" font-size="12" class="f-quiet">The lane's objects past the checkpoint, in</text>
    <text x="394" y="694" font-size="12" class="f-quiet">custody order</text>
    <text x="394" y="150" font-weight="600" font-size="12" class="f-ink">statement  ◂ answers</text>
    <text x="394" y="166" font-size="12" class="f-quiet">Each statement's outcome: committed, not</text>
    <text x="394" y="182" font-size="12" class="f-quiet">applied, or unresolved until it can no</text>
    <text x="394" y="198" font-size="12" class="f-quiet">longer land</text>
    <text x="394" y="222" font-weight="600" font-size="12" class="f-ink">row_counts  ◂ counts</text>
    <text x="394" y="238" font-size="12" class="f-quiet">How many rows of each object central holds,</text>
    <text x="394" y="254" font-size="12" class="f-quiet">by content key (D11)</text>
    <text x="394" y="718" font-weight="600" font-size="12" class="f-ink">complete_through  ◂ list, get</text>
    <text x="394" y="734" font-size="12" class="f-quiet">The lane's watermark: the custody time up</text>
    <text x="394" y="750" font-size="12" class="f-quiet">to which everything the edge held is</text>
    <text x="394" y="766" font-size="12" class="f-quiet">ingested (D29)</text>
    <text x="394" y="790" font-weight="600" font-size="12" class="f-ink">lane_closed  ◂ list, get</text>
    <text x="394" y="806" font-size="12" class="f-quiet">Whether every incarnation of the lane's</text>
    <text x="394" y="822" font-size="12" class="f-quiet">edge has closed or been tombstoned, so its</text>
    <text x="394" y="838" font-size="12" class="f-quiet">custody is empty (D35)</text>

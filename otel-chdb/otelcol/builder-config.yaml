# A collector distribution with the chdb exporter: OTLP in, chDB on disk.
#   go run go.opentelemetry.io/collector/cmd/builder@v0.161.0 --config builder-config.yaml
dist:
  name: otelcol-chdb
  description: OpenTelemetry Collector with the chdb exporter (in-process chDB)
  output_path: ./_build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.161.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.161.0
exporters:
  - gomod: github.com/chucklehead-dev/oscope/spike/otel-chdb/chdbexporter v0.0.0
    path: ../chdbexporter
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.161.0
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.161.0

replaces:
  # The chdb-go fork with the binary-safe streaming insert. Relative to
  # output_path.
  - github.com/chdb-io/chdb-go/v2 => ../../chdb-go

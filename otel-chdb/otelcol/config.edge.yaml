# DEPRECATED (2026-09-27): the chDB edge is retired as a publisher
# (DECISIONS.md D1: chDB rejected for publishing; kept only for an edge that
# must answer SQL locally). Do not deploy this file. The publishers are the
# Rust `s3pq` exporter (../otap-rs/configs/edge-publisher.yaml,
# ../deploy/base/rust) and the Go `s3pq` exporter
# (../deploy/base/go/publisher-config.yaml, ../parquetgo/s3pqexporter).
#
# Known defect, left in place because nothing runs it (DECISIONS.md D4,
# Open risks): the `batch` processor below sits in front of the persistent
# queue, and it is asynchronous, so the receiver acknowledges a request once
# the batcher holds it, before the queue write: a SIGKILL loses acknowledged
# data (deploy/results/go-batch.txt, k8s-sim.md §8). A revived chDB edge
# must follow D4 as the Go publisher does: no `batch` processor and no
# `sending_queue.batch` in front of the queue (a queue item is the sender's
# request), or a batch step inside the exporter that answers each caller
# only once the merged request is persisted (s3pqexporter/batch.go).
#
# Edge-buffer mode: OTLP in; each batch published to object storage as
# s3_plain_rewritable MergeTree parts and as a Parquet object, then announced
# by a manifest. Generations rotate hourly, are sealed, and are detached
# locally after 6h; the objects stay for a central consumer to read and
# reclaim. Credentials come from the environment.
#
# Delivery settings follow awss3/README.md §Recommendation (collector config)
# and DECISIONS.md D4 as of 2026-09-26 (superseded 2026-09-27, above): batch
# BEFORE the persistent queue with the batch processor, never `sending_queue.batch` (it re-batches redelivered
# requests after a restart, so request identity and its content hash change);
# `retry_on_failure.max_elapsed_time: 0` (the 300 s default deletes the item
# from the queue after the last failure); `seal_optimize: false` (OPTIMIZE
# FINAL at seal makes the object leak on exit certain: bench/central/REPORT.md,
# model/README.md). The batch processor's in-memory window is lost on a crash;
# the receiver has already acked it.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317

extensions:
  file_storage/queue:
    directory: ./data/queue
    create_directory: true

exporters:
  chdb:
    path: ./data/chdb
    database: otel
    connections: 2
    producer:
      id: ${env:PRODUCER_ID:-edge-1}
      region: ${env:REGION:-local}
      schema_version: 1
    object_storage:
      endpoint: ${env:S3_ENDPOINT}
      access_key_id: ${env:S3_ACCESS_KEY_ID}
      secret_access_key: ${env:S3_SECRET_ACCESS_KEY}
      generation: 1h
      local_retention: 6h
      seal_optimize: false             # see the header
      compact_parts: true
      old_parts_lifetime: 10m
    parquet:
      url: ${env:S3_ENDPOINT}/parquet
      access_key_id: ${env:S3_ACCESS_KEY_ID}
      secret_access_key: ${env:S3_SECRET_ACCESS_KEY}
      compression: zstd
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0              # retry forever; never drop from the queue
    # No `batch:` here: batching happens in the pipeline, before the queue.
    sending_queue:
      storage: file_storage/queue
      num_consumers: 2
      sizer: items
      queue_size: 200000

processors:
  # First in every pipeline: refuse data (retryable) before the collector
  # runs out of memory. The ocb build already carried the processor; no
  # pipeline used it.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # 10,000 rows per object (DECISIONS.md §1.2, risk #11): the size the
  # consumer's statement limits and every benchmark assume.
  batch:
    timeout: 5s
    send_batch_size: 10000
    send_batch_max_size: 10000

service:
  extensions: [file_storage/queue]
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [chdb]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [chdb]
